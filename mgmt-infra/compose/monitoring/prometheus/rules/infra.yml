# インフラ層のアラートルール
groups:
  - name: availability
    rules:
      - alert: HostDown
        # ICMP が 5 分間応答しない
        expr: probe_success{job="blackbox-icmp"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ホスト {{ $labels.instance }} が応答しません"
          description: "5分以上 ICMP に応答していません。"

      - alert: ServiceDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "サービス {{ $labels.instance }} に接続できません"

      - alert: ExporterDown
        # スクレイプ自体が失敗している(exporter の停止など)
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "スクレイプ対象 {{ $labels.instance }} が停止しています"

  - name: resources
    rules:
      - alert: DiskSpaceLow
        # 今回の教訓: ディスク枯渇は前兆があり、これは確実に防げる
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} の空きが15%未満です"

      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} の空きが5%未満です"

      - alert: MemoryPressure
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の空きメモリが10%未満です"

      - alert: VzdumpBackupStale
        # 日次バックアップなので36時間を閾値とする。
        # 1回の失敗では鳴らず、2回連続で失敗すると鳴る。
        expr: time() - vzdump_last_backup_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "VM {{ $labels.vmid }} のバックアップが36時間以上更新されていない"

      - alert: NvmeCriticalWarning
        # コントローラが自己申告する異常。0以外は即対応が必要
        expr: smartctl_device_critical_warning > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} が critical warning を報告しています"

      - alert: NvmeWearHigh
        # 摩耗はゆっくり進むので早期に気づける
        expr: smartctl_device_percentage_used > 80
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} の摩耗が80%を超えました"

      - alert: NvmeTemperatureHigh
        # 小型筐体は M.2 の風が通りにくく、サーマルスロットリングの前兆になる
        expr: smartctl_device_temperature{temperature_type="current"} > 70
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} の温度が70℃を超えています"

      - alert: NvmeUnsafeShutdown
        # 意図しない電断の検知。前回の故障の寄与要因候補だった
        expr: increase(smartctl_device_unsafe_shutdowns[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} で意図しない電断が発生しました"

      - alert: ThinPoolAlmostFull
        # 満杯になると thin pool 上の全 VM が同時に破損する
        expr: lvm_thinpool_data_percent > 85
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.vg }}/{{ $labels.lv }} の使用率が85%を超えました"

      - alert: ThinPoolMetadataAlmostFull
        # メタデータ枯渇でも同様に壊れる。見落としやすい
        expr: lvm_thinpool_metadata_percent > 85
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.vg }}/{{ $labels.lv }} のメタデータ使用率が85%を超えました"

  - name: services
    rules:
      - alert: AdGuardHomeDown
        # 内部DNSが落ちると家庭内の名前解決に影響が出る
        expr: node_systemd_unit_state{name="AdGuardHome.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdGuard Home が停止しています"
          description: "内部DNSが応答しません。名前解決に影響が出ます。"

      - alert: DockerDown
        expr: node_systemd_unit_state{name="docker.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Docker が停止しています"

  - name: kubernetes
    rules:
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ノード {{ $labels.node }} が Ready ではありません"

      - alert: KubePodCrashLooping
        # 30分で5回以上の再起動は異常とみなす
        expr: increase(kube_pod_container_status_restarts_total[30m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} が再起動を繰り返しています"

      - alert: KubePodNotReady
        expr: kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} が {{ $labels.phase }} のままです"

      - alert: KubePVCNotBound
        expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} が Bound ではありません"



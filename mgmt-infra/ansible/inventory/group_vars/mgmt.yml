# 管理ホスト共通の変数
---
# タイムゾーン
mgmt_timezone: Asia/Tokyo

# 全ホストに導入する基本パッケージ
mgmt_common_packages:
  - vim
  - htop
  - tree
  - jq
  - net-tools
  - dnsutils
  - unattended-upgrades

# Docker のログローテーション設定
# 監視スタックを長期稼働させるため、ログの無制限な肥大化を防ぐ
docker_log_max_size: "10m"
docker_log_max_file: "3"

mgmt_ip: 192.168.3.11

# vzdump の鮮度を監視する対象 VM
vzdump_watch_vmids: [201, 211, 212]

# node_exporter の textfile コレクタが読むディレクトリ
node_exporter_textfile_dir: /var/lib/prometheus/node-exporter

# vzdump の保存先(PVE から NFS で書かれる)
vzdump_backup_dir: /srv/pve-backup/dump

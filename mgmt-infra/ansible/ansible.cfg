# Ansible 実行設定
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
# 実行結果を YAML 形式で表示する
# (旧 community.general.yaml コールバックは 12.0.0 で削除されたため
#  default コールバックの result_format オプションを使用する)
stdout_callback = default
result_format = yaml
# 冪等性確認時に差分を常に表示
diff = always
# 不要な cowsay を無効化
nocows = True
# ホストキーチェック(将来リモートを扱う際に有効)
host_key_checking = True
# 実行時間の長いタスクを可視化
callbacks_enabled = ansible.posix.profile_tasks

[privilege_escalation]
become = False
become_method = sudo

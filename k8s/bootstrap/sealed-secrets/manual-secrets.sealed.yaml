---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: k3s-local-ca-secret
  namespace: cert-manager
spec:
  encryptedData:
    ca.crt: 
    tls.crt: 
    tls.key: 
  template:
    metadata:
      annotations:
        cert-manager.io/alt-names: ""
        cert-manager.io/certificate-name: k3s-local-ca
        cert-manager.io/common-name: k3s-local-ca
        cert-manager.io/ip-sans: ""
        cert-manager.io/issuer-group: ""
        cert-manager.io/issuer-kind: ClusterIssuer
        cert-manager.io/issuer-name: selfsigned-issuer
        cert-manager.io/uri-sans: ""
      labels:
        controller.cert-manager.io/fao: "true"
      name: k3s-local-ca-secret
      namespace: cert-manager
    type: kubernetes.io/tls
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: letsencrypt-cloudflare-account-key
  namespace: cert-manager
spec:
  encryptedData:
    tls.key: 
  template:
    metadata:
      name: letsencrypt-cloudflare-account-key
      namespace: cert-manager
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: bulletin-tunnel-credentials
  namespace: cloudflare
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      name: bulletin-tunnel-credentials
      namespace: cloudflare
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      annotations:
        argocd.argoproj.io/tracking-id: nextcloud:/Secret:nextcloud/nextcloud-secret
      name: nextcloud-secret
      namespace: nextcloud
    type: Opaque

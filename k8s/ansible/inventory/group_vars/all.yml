# クラスタ全体の設定値。
# kubeadm の設定と Cilium の Helm values は、どちらもここを参照して生成する。
# 両者の CIDR がずれると Pod が起動しないため、値の定義はこのファイルに集約する。
---
common_timezone: Asia/Tokyo

common_packages:
  - curl
  - gnupg
  - apt-transport-https
  - ca-certificates
  # Longhorn がブロックデバイスをアタッチするために必要
  - open-iscsi
  # Longhorn のバックアップターゲット(mgmt host の NFS)接続用
  - nfs-common
  # PVE からの ACPI シャットダウンを確実にするため。
  # 旧環境ではこれが無く qm shutdown が毎回タイムアウトしていた
  - qemu-guest-agent

# Kubernetes のバージョン。
# apt リポジトリはマイナーバージョン単位で分かれているため両方を持つ。
k8s_version_minor: "1.34"
# パッチ番号以降の接尾辞は変わりうるためワイルドカードで指定する
k8s_package_version: "1.34.6-*"

# 旧 k3s 環境と同じレンジを踏襲する
k8s_pod_cidr: "10.42.0.0/16"
k8s_service_cidr: "10.43.0.0/16"

# control-plane の API エンドポイント
k8s_control_plane_ip: "192.168.3.101"

# containerd が使う pause イメージ。
# kubeadm が要求する版と揃える(kubeadm config images list で確認できる)
containerd_pause_image: "registry.k8s.io/pause:3.10.1"

# Cilium
# バージョンは明示的に固定する。再構築時に別バージョンが入ると
# 挙動の差分と構成の差分が混ざって切り分けできなくなるため。
cilium_version: "1.20.1"    # ← 調べた値に置き換える

# Helm 本体。upgrade は creates で抑止されるため、
# 上げるときは /usr/local/bin/helm を削除してから再適用する。
helm_version: "3.16.4"

# クラスタ全体の設定値。
# kubeadm の設定と Cilium の Helm values は、どちらもここを参照して生成する。
# 両者の CIDR がずれると Pod が起動しないため、値の定義はこのファイルに集約する。
---
common_timezone: Asia/Tokyo

common_packages:
  - curl
  - gnupg
  - apt-transport-https
  - ca-certificates
  # Longhorn がブロックデバイスをアタッチするために必要
  - open-iscsi
  # Longhorn のバックアップターゲット(mgmt host の NFS)接続用
  - nfs-common
  # PVE からの ACPI シャットダウンを確実にするため。
  # 旧環境ではこれが無く qm shutdown が毎回タイムアウトしていた
  - qemu-guest-agent

# Kubernetes のバージョン。
# apt リポジトリはマイナーバージョン単位で分かれているため両方を持つ。
k8s_version_minor: "1.34"
# パッチ番号以降の接尾辞は変わりうるためワイルドカードで指定する
k8s_package_version: "1.34.6-*"

# 旧 k3s 環境と同じレンジを踏襲する
k8s_pod_cidr: "10.42.0.0/16"
k8s_service_cidr: "10.43.0.0/16"

# control-plane の API エンドポイント
k8s_control_plane_ip: "192.168.3.101"

# containerd が使う pause イメージ。
# kubeadm が要求する版と揃える(kubeadm config images list で確認できる)
containerd_pause_image: "registry.k8s.io/pause:3.10.1"

# Cilium
# バージョンは明示的に固定する。再構築時に別バージョンが入ると
# 挙動の差分と構成の差分が混ざって切り分けできなくなるため。
cilium_version: "1.20.1"    # ← 調べた値に置き換える

# kube-proxy を Cilium の eBPF 実装で置き換えるか。
# Cilium の Gateway API は true が必須のため有効化している。
# 切り替え後は kube-proxy DaemonSet を削除する。
cilium_kube_proxy_replacement: true

# Helm 本体。upgrade は creates で抑止されるため、
# 上げるときは /usr/local/bin/helm を削除してから再適用する。
helm_version: "3.16.4"

# MetalLB
metallb_version: "0.15.2"    # helm search repo metallb/metallb --versions で確認して固定する
# LoadBalancer に払い出す IP レンジ。
# 旧環境と同じ値を使う。DHCP の払い出し範囲と重ならないこと。
metallb_ip_range: "192.168.3.200-192.168.3.230"

cert_manager_acme_email: "5511068t@gmail.com"
cert_manager_dns_zone: "shooonng.com"

# Gateway API
# Cilium 1.20.1 が要求する版に合わせる。
# Cilium を上げるときは公式ドキュメントで対応版を確認すること。
gateway_api_version: "v1.6.1"

# Cilium が管理する CRD 一式(standard チャネル)
gateway_api_crds:
  - gatewayclasses
  - gateways
  - httproutes
  - referencegrants
  - grpcroutes
  - backendtlspolicies
  - tlsroutes

# Longhorn
longhorn_version: "1.10.1"    # helm search repo longhorn/longhorn --versions で確認して固定

# レプリカ数は 2。
# kubeadm では control-plane に NoSchedule の taint が付くため、
# スケジュール可能なノードは worker 2台のみ。
# 3 のままだと常に Degraded になる。
longhorn_replica_count: 2

# SealedSecrets
sealed_secrets_version: "2.19.3"    # helm search repo sealed-secrets/sealed-secrets --versions で確認して固定
# 旧環境の秘密鍵が kube-system にあるため、controller も同じ namespace に置く。
# 場所がずれると復元した鍵を読めず、既存の SealedSecret が復号できなくなる。
sealed_secrets_namespace: kube-system

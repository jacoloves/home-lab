# kubeadm クラスタのノード構成管理
#
# 実行:
#   make check   # dry-run
#   make apply   # 適用
---
- name: Kubernetes ノードの共通構成
  hosts: all
  become: true
  roles:
    - common
    - containerd
    - kubernetes
    - node_exporter

- name: control-plane の初期化
  hosts: control_plane
  become: true
  roles:
    - control_plane
    - cilium

- name: worker のクラスタ参加
  hosts: workers
  become: true
  roles:
    - worker

# ArgoCD が動くまでに必要な基盤。
# これ以降のアプリケーションは ArgoCD の管轄とする。
- name: クラスタ基盤の導入
  hosts: control_plane
  become: true
  roles:
    - metallb
    - longhorn
    - sealed_secrets
    - cert_manager
    - gateway
    - argocd

# kubeadm クラスタのノード構成管理
#
# 実行:
#   make check   # dry-run
#   make apply   # 適用
---
- name: Kubernetes ノードの共通構成
  hosts: all
  become: true
  roles:
    - common
    - containerd
    - kubernetes

- name: control-plane の初期化
  hosts: control_plane
  become: true
  roles:
    - control_plane
    - cilium
    - metallb
    - longhorn

- name: worker のクラスタ参加
  hosts: workers
  become: true
  roles:
    - worker

# Ansible 実行設定(kubeadm クラスタ用)
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
stdout_callback = default
result_format = yaml
diff = always
nocows = True
# VM を作り直すたびにホストキーが変わるため accept-new を使う。
# False にすると変更されたキーも無条件に受け入れてしまうので避ける。
host_key_checking = True
callbacks_enabled = ansible.posix.profile_tasks
# Ubuntu 24.04 の既定。自動検出の警告を抑止する
interpreter_python = /usr/bin/python3
remote_tmp = /tmp/.ansible-${USER}/tmp

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

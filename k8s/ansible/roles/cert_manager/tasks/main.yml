# 証明書の自動発行(cert-manager)
#
# 前提: cloudflare-api-token が SealedSecret 経由で
#       cert-manager namespace に存在すること。
---
- name: cert-manager の Helm リポジトリを登録する
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: cert-manager を導入する
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    # CRD をチャートに管理させる。
    # 別管理にするとバージョン不整合の温床になる。
    values:
      crds:
        enabled: true
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 10m

- name: Issuer の定義を配置する
  ansible.builtin.template:
    src: issuers.yaml.j2
    dest: /etc/kubernetes/cert-manager-issuers.yaml
    mode: "0644"
    owner: root
    group: root

# webhook が起動しないと CRD の適用が弾かれるため、
# Helm の wait: true で待ってから実行する。
- name: Issuer を適用する
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/cert-manager-issuers.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cert_manager_issuers
  changed_when: >-
    'created' in cert_manager_issuers.stdout
    or 'configured' in cert_manager_issuers.stdout

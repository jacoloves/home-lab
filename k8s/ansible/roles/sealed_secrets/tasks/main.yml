# SealedSecrets controller
#
# 経緯: 旧クラスタの秘密鍵は退避したものの復号できなくなった。
#       ただし SealedSecret 由来のシークレットは1本のみで、
#       その平文は別途退避済みだったため、鍵は新規生成とした。
#       生成された鍵は docs/sealed-secrets-restore.md の手順で退避すること。
---
- name: SealedSecrets の Helm リポジトリを登録する
  kubernetes.core.helm_repository:
    name: sealed-secrets
    repo_url: https://bitnami.github.io/sealed-secrets

- name: SealedSecrets を導入する
  kubernetes.core.helm:
    name: sealed-secrets
    chart_ref: sealed-secrets/sealed-secrets
    chart_version: "{{ sealed_secrets_version }}"
    release_namespace: "{{ sealed_secrets_namespace }}"
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 5m

# 鍵が無い状態は封緘済みマニフェストが全滅する状態を意味するため、
# 生成・存在を明示的に確認する。
- name: 秘密鍵が存在することを確認する
  ansible.builtin.command: >-
    kubectl -n {{ sealed_secrets_namespace }} get secrets
    -l sealedsecrets.bitnami.com/sealed-secrets-key -o name
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: sealed_secrets_keys
  changed_when: false
  failed_when: sealed_secrets_keys.stdout | length == 0

# 分散ブロックストレージ(Longhorn)
---
- name: Longhorn の Helm リポジトリを登録する
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io

- name: values ファイルを配置する
  ansible.builtin.template:
    src: longhorn-values.yaml.j2
    dest: /etc/kubernetes/longhorn-values.yaml
    mode: "0644"
    owner: root
    group: root

- name: Longhorn を導入する
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_version }}"
    release_namespace: longhorn-system
    create_namespace: true
    values_files:
      - /etc/kubernetes/longhorn-values.yaml
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 15m

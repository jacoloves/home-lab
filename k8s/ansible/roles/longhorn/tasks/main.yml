# 分散ブロックストレージ(Longhorn)
---
- name: Longhorn の Helm リポジトリを登録する
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io

- name: values ファイルを配置する
  ansible.builtin.template:
    src: longhorn-values.yaml.j2
    dest: /etc/kubernetes/longhorn-values.yaml
    mode: "0644"
    owner: root
    group: root

- name: Longhorn を導入する
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_version }}"
    release_namespace: longhorn-system
    create_namespace: true
    values_files:
      - /etc/kubernetes/longhorn-values.yaml
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 15m

- name: バックアップ先の定義を配置する
  ansible.builtin.template:
    src: backup-target.yaml.j2
    dest: /etc/kubernetes/longhorn-backup-target.yaml
    mode: "0644"
    owner: root
    group: root

- name: バックアップ先を適用する
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/longhorn-backup-target.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: longhorn_backup_target
  changed_when: >-
    'created' in longhorn_backup_target.stdout
    or 'configured' in longhorn_backup_target.stdout

- name: 定期バックアップジョブの定義を配置する
  ansible.builtin.template:
    src: recurring-job.yaml.j2
    dest: /etc/kubernetes/longhorn-recurring-job.yaml
    mode: "0644"
    owner: root
    group: root

- name: 定期バックアップジョブを適用する
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/longhorn-recurring-job.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: longhorn_recurring_job
  changed_when: >-
    'created' in longhorn_recurring_job.stdout
    or 'configured' in longhorn_recurring_job.stdout

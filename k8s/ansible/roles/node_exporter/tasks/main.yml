# ノードのメトリクス公開
---
- name: node_exporter を導入する
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 設定ディレクトリを作成する(systemd drop-in)
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root

# 既定では systemd コレクタが無効。kubelet や containerd の停止を
# 検知したいため有効化する。
- name: コレクタと待ち受けアドレスを設定する
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    mode: "0644"
    owner: root
    group: root
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/prometheus-node-exporter \
        --collector.systemd \
        --web.listen-address={{ ansible_host }}:9100
  notify: Restart node exporter

- name: node_exporter を有効化する
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

# control-plane の初期化
---
- name: kubeadm の設定ファイルを配置する
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"
    owner: root
    group: root

# admin.conf の有無で初期化済みかを判定する。
# 二重初期化を防ぐため creates を使い、冪等性を担保する。
- name: クラスタを初期化する
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: 作業ユーザ用の kubeconfig ディレクトリを作成する
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: kubeconfig を配置する
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

# トークンは既定で 24 時間で失効するため、参加時に都度発行する
- name: worker 参加用のコマンドを生成する
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: 参加コマンドをファクトとして保持する
  ansible.builtin.set_fact:
    k8s_join_command: "{{ kubeadm_join_command.stdout }}"
